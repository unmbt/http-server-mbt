name: C ABI Libraries (Matrix CI)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish packages to npm'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cabi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-build:
    name: ${{ matrix.os_name }} (${{ matrix.arch }}) · C ABI Libraries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            arch: x86_64
            platform: windows-amd64
            npm_dir: win32-x64-msvc
            node_file: http_server.win32-x64-msvc.node
          - os: ubuntu-latest
            os_name: Linux
            arch: x86_64
            platform: linux-amd64
            npm_dir: linux-x64-gnu
            node_file: http_server.linux-x64-gnu.node
          - os: macos-latest
            os_name: macOS
            arch: arm64
            platform: macos-arm64
            npm_dir: darwin-arm64
            node_file: http_server.darwin-arm64.node

    steps:
      - name: Disable Git EOL conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Update Registry & Dependencies
        run: moon update

      - name: Build and Verify C ABI Libraries (thin & full)
        run: moon run scripts/build_cabi.mbtx

      - name: Setup Node.js (v24 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Node-API Native Module (full)
        run: moon run scripts/build_node.mbtx

      - name: Run Node-API Native Module Integration Tests
        run: node npm/test/index.test.js

      - name: Upload Node-API Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-binary-${{ matrix.npm_dir }}
          path: npm/${{ matrix.npm_dir }}/${{ matrix.node_file }}
          retention-days: 7

      - name: Prepare C ABI SDK Artifacts
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="release-cabi"
          SDK_DIR="cabi-sdk"
          rm -rf "$RELEASE_DIR" "$SDK_DIR"
          mkdir -p "$RELEASE_DIR" "$SDK_DIR/include" "$SDK_DIR/lib"

          PLATFORM="${{ matrix.platform }}"

          # C ABI SDK (header + libraries)
          cp "target/cabi/include/http_server.h" "$SDK_DIR/include/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/cabi/hs_thin.dll "$SDK_DIR/lib/"
            cp target/cabi/hs_thin.lib "$SDK_DIR/lib/"
            cp target/cabi/hs_thin_static.lib "$SDK_DIR/lib/"
            cp target/cabi/hs_full.dll "$SDK_DIR/lib/"
            cp target/cabi/hs_full.lib "$SDK_DIR/lib/"
            cp target/cabi/hs_full_static.lib "$SDK_DIR/lib/"
            tar -acf "$RELEASE_DIR/http-server-cabi-${PLATFORM}.zip" -C "$SDK_DIR" include lib
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp target/cabi/libhs_thin.dylib "$SDK_DIR/lib/"
            cp target/cabi/libhs_thin.a "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.dylib "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.a "$SDK_DIR/lib/"
            tar -czf "$RELEASE_DIR/http-server-cabi-${PLATFORM}.tar.gz" -C "$SDK_DIR" include lib
          else
            cp target/cabi/libhs_thin.so "$SDK_DIR/lib/"
            cp target/cabi/libhs_thin.a "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.so "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.a "$SDK_DIR/lib/"
            tar -czf "$RELEASE_DIR/http-server-cabi-${PLATFORM}.tar.gz" -C "$SDK_DIR" include lib
          fi

          echo "=== C ABI Assets Ready ==="
          ls -la "$RELEASE_DIR"

      - name: Upload C ABI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cabi-${{ matrix.platform }}
          path: release-cabi/
          retention-days: 7

  publish-npm:
    name: Publish to npm Registry
    needs: matrix-build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance / Trusted Publishing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Download win32-x64-msvc binary
        uses: actions/download-artifact@v8
        with:
          name: node-binary-win32-x64-msvc
          path: npm/win32-x64-msvc

      - name: Download linux-x64-gnu binary
        uses: actions/download-artifact@v8
        with:
          name: node-binary-linux-x64-gnu
          path: npm/linux-x64-gnu

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: node-binary-darwin-arm64
          path: npm/darwin-arm64

      - name: Synchronize npm Package Versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p 'require("./npm/http-server/package.json").version')"
          fi
          echo "Synchronizing npm packages to version: ${VERSION}"

          update_version() {
            local pkg_file="$1"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('${pkg_file}', 'utf8'));
              pkg.version = '${VERSION}';
              if (pkg.optionalDependencies) {
                for (const k of Object.keys(pkg.optionalDependencies)) {
                  pkg.optionalDependencies[k] = '${VERSION}';
                }
              }
              fs.writeFileSync('${pkg_file}', JSON.stringify(pkg, null, 2) + '\n');
            "
          }

          update_version "npm/win32-x64-msvc/package.json"
          update_version "npm/linux-x64-gnu/package.json"
          update_version "npm/darwin-arm64/package.json"
          update_version "npm/http-server/package.json"

      - name: Publish Platform Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN not provided; removing .npmrc to use npm Trusted Publishing (OIDC)..."
            rm -f ~/.npmrc
          fi
          echo "Publishing platform packages with provenance..."
          (cd npm/win32-x64-msvc && npm publish --access public --provenance)
          (cd npm/linux-x64-gnu && npm publish --access public --provenance)
          (cd npm/darwin-arm64 && npm publish --access public --provenance)

      - name: Publish Main Package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN not provided; removing .npmrc to use npm Trusted Publishing (OIDC)..."
            rm -f ~/.npmrc
          fi
          echo "Publishing main package with provenance..."
          (cd npm/http-server && npm publish --access public --provenance)

  release:
    name: Create GitHub Release (C ABI)
    needs: matrix-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all C ABI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cabi-*
          path: artifacts
          merge-multiple: true

      - name: Release C ABI SDK
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
