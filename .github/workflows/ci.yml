name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 enabled by T-032 Linux sub-deliverable (D-16):
          # native check/test + artifact. macOS stays disabled until its
          # kqueue + Darwin sendfile work lands (per D-16, unimplemented
          # platform sub-deliverables must not be declared passing).
          # - os: macos-latest
          #   artifact_name: http-server-mbt-macos-arm64
          - os: ubuntu-latest
            artifact_name: http-server-mbt-linux-amd64
          - os: windows-latest
            artifact_name: http-server-mbt-windows-amd64.exe

    steps:
      - name: Disable Git EOL conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify fixture bytes (no CRLF rewrite)
        shell: bash
        run: |
          set -euo pipefail
          size=$(wc -c < testdata/public/hello.txt | tr -d ' ')
          if [ "$size" != "14" ]; then
            echo "testdata/public/hello.txt is $size bytes, expected 14 (LF). Git EOL conversion leaked into fixtures."
            exit 1
          fi
          git ls-files --eol testdata/public/hello.txt

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry & Dependencies
        run: moon update

      - name: Test
        run: moon test --target native

      - name: Build Release
        run: moon build --target native --release

      - name: Prepare Artifact
        shell: bash
        run: cp _build/native/release/build/cmd/http-server-mbt/http-server-mbt.exe ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
