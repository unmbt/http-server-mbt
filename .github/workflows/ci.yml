name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: http-server-mbt-linux-amd64
            binary_path: _build/native/release/build/src/main/main
          - os: macos-latest
            artifact_name: http-server-mbt-macos-arm64
            binary_path: _build/native/release/build/src/main/main
          - os: windows-latest
            artifact_name: http-server-mbt-windows-amd64.exe
            binary_path: _build\native\release\build\src\main\main.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbitlang/setup-moonbit@v1

      - name: Install dependencies
        run: moon install

      - name: Test
        run: moon test

      - name: Build Release
        run: moon build --target native --release

      - name: Prepare Artifact (Unix)
        if: runner.os != 'Windows'
        run: cp ${{ matrix.binary_path }} ${{ matrix.artifact_name }}

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: copy ${{ matrix.binary_path }} ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
