name: Candidate acceptance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:
    inputs:
      extended_exploration:
        type: boolean
        default: false
        description: Run the longer saved-seed resource exploration

permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HS_EXTENDED_EXPLORATION: ${{ inputs.extended_exploration && '1' || '0' }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: '21.1.8'
          directory: ${{ runner.temp }}/llvm
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
      - name: Native, resource, CLI, C ABI and external MoonBit/C/Rust/Python checks
        run: moon run scripts/check/validate_candidate.mbtx
      - name: Node 22 offline candidate installation and lifecycle
        run: moon run scripts/check/check_node_candidate.mbtx
      - uses: actions/setup-node@v7
        with:
          node-version: '24.10.0'
      - name: Node 24 offline candidate installation and lifecycle
        run: moon run scripts/check/check_node_candidate.mbtx
      - name: Linux four-container matrix
        if: runner.os == 'Linux'
        run: moon run scripts/build/build_docker.mbtx
      - name: Record same-commit candidate inventory
        run: moon run scripts/release/candidate_manifest.mbtx
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ runner.os }}-${{ runner.arch }}
          path: target/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ runner.os }}-${{ runner.arch }}
          path: target/sanitizer/
          if-no-files-found: warn

  candidate-gate:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: target/verified-candidates
      - name: Check OS/CPU, commit and artifact SHA-256
        run: moon run scripts/release/verify_candidates.mbtx
