name: CLI (Matrix CI)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os_name }} (${{ matrix.arch }}) · CLI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            arch: x86_64
            platform: windows-amd64
            exe_ext: ".exe"
          - os: ubuntu-latest
            os_name: Linux
            arch: x86_64
            platform: linux-amd64
            exe_ext: ""
          - os: macos-latest
            os_name: macOS
            arch: arm64
            platform: macos-arm64
            exe_ext: ""

    steps:
      - name: Disable Git EOL conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify fixture bytes (no CRLF rewrite)
        shell: bash
        run: |
          set -euo pipefail
          size=$(wc -c < testdata/public/hello.txt | tr -d ' ')
          if [ "$size" != "14" ]; then
            echo "testdata/public/hello.txt is $size bytes, expected 14 (LF). Git EOL conversion leaked into fixtures."
            exit 1
          fi
          git ls-files --eol testdata/public/hello.txt

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry & Dependencies
        run: moon update

      - name: Check (native)
        run: moon check --target native

      - name: Test (native)
        run: moon test --target native

      - name: Build Release (native)
        run: moon build cmd/http-server-mbt cmd/http-server-mbt-thin --target native --release

      - name: Smoke-test CLI variants
        shell: bash
        run: |
          set -euo pipefail
          EXE_EXT="${{ matrix.exe_ext }}"
          FULL_BIN="_build/native/release/build/cmd/http-server-mbt/http-server-mbt${EXE_EXT}"
          THIN_BIN="_build/native/release/build/cmd/http-server-mbt-thin/http-server-mbt-thin${EXE_EXT}"

          test -f "$FULL_BIN"
          test -f "$THIN_BIN"

          chmod +x "$FULL_BIN" "$THIN_BIN" || true

          # 1. Verify versions
          "$FULL_BIN" --version
          "$THIN_BIN" --version

          # 2. Thin CLI parameter rejection test (strictly exit code 1)
          for flag in "--cert cert.pem" "--key key.pem" "--key-passphrase pass" "-P" "--proxy http://127.0.0.1:3000" "--proxy-all" "--proxy-config proxy.json"; do
            set +e
            "$THIN_BIN" $flag 2>/dev/null
            exit_code=$?
            set -e
            if [ $exit_code -eq 0 ]; then
              echo "Error: http-server-mbt-thin accepted unsupported flag: $flag"
              exit 1
            fi
          done

          # 3. Full CLI help and proxy options
          "$FULL_BIN" --help
          "$THIN_BIN" --help

      - name: Verify generated version file is in sync
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code cmd/http-server-mbt/generated_version.mbt

      - name: Prepare Artifacts (Full & Thin CLI)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-cli
          EXE_EXT="${{ matrix.exe_ext }}"
          PLATFORM="${{ matrix.platform }}"
          cp "_build/native/release/build/cmd/http-server-mbt/http-server-mbt${EXE_EXT}" "release-cli/http-server-mbt-${PLATFORM}${EXE_EXT}"
          cp "_build/native/release/build/cmd/http-server-mbt-thin/http-server-mbt-thin${EXE_EXT}" "release-cli/http-server-mbt-thin-${PLATFORM}${EXE_EXT}"
          chmod +x release-cli/* || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: release-cli/
          retention-days: 7

  publish:
    name: Publish to mooncakes.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry & Dependencies
        run: moon update

      - name: Verify Tag Version
        shell: bash
        run: |
          module_version="$(moon -q run cmd/http-server-mbt -- --version)"
          if [ "v${module_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match moon.mod version ${module_version}."
            exit 1
          fi

      - name: Configure Mooncakes Credentials
        shell: bash
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_CREDENTIALS }}
        run: |
          if [ -z "${MOONCAKES_CREDENTIALS}" ]; then
            echo "MOONCAKES_CREDENTIALS is not configured."
            exit 1
          fi
          install -d -m 700 "${HOME}/.moon"
          printf '%s' "${MOONCAKES_CREDENTIALS}" > "${HOME}/.moon/credentials.json"
          chmod 600 "${HOME}/.moon/credentials.json"

      - name: Publish Module
        run: moon publish

  release:
    name: Create GitHub Release (CLI)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Release CLI Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
