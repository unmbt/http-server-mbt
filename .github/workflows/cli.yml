name: CLI (Matrix CI)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os_name }} (${{ matrix.arch }}) · CLI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            arch: x86_64
            platform: windows-amd64
            exe_ext: ".exe"
          - os: ubuntu-latest
            os_name: Linux
            arch: x86_64
            platform: linux-amd64
            exe_ext: ""
          - os: macos-latest
            os_name: macOS
            arch: arm64
            platform: macos-arm64
            exe_ext: ""

    steps:
      - name: Disable Git EOL conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify fixture bytes (no CRLF rewrite)
        shell: bash
        run: |
          set -euo pipefail
          size=$(wc -c < testdata/public/hello.txt | tr -d ' ')
          if [ "$size" != "14" ]; then
            echo "testdata/public/hello.txt is $size bytes, expected 14 (LF). Git EOL conversion leaked into fixtures."
            exit 1
          fi
          git ls-files --eol testdata/public/hello.txt

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry & Dependencies
        run: moon update

      - name: Check (native)
        run: moon check --target native

      - name: Test (native)
        run: moon test --target native

      - name: Build Release (native)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Enable static linking for Linux ELF to run cleanly in distroless/static (D-08, D-15)
            sed -i 's/"stub-cc-flags": "-fPIC"/"stub-cc-flags": "-fPIC", "cc-link-flags": "-static"/g' cmd/http-server-mbt/moon.pkg cmd/http-server-mbt-thin/moon.pkg
            grep -q '"cc-link-flags": "-static"' cmd/http-server-mbt/moon.pkg || { echo "ERROR: failed to inject static link flag in cmd/http-server-mbt/moon.pkg"; exit 1; }
            grep -q '"cc-link-flags": "-static"' cmd/http-server-mbt-thin/moon.pkg || { echo "ERROR: failed to inject static link flag in cmd/http-server-mbt-thin/moon.pkg"; exit 1; }
          fi
          moon build cmd/http-server-mbt cmd/http-server-mbt-thin --target native --release
          if [ "${{ runner.os }}" = "Linux" ]; then
            git checkout cmd/http-server-mbt/moon.pkg cmd/http-server-mbt-thin/moon.pkg
          fi

      - name: Assert Linux Binaries are Statically Linked (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          FULL_BIN="_build/native/release/build/cmd/http-server-mbt/http-server-mbt.exe"
          THIN_BIN="_build/native/release/build/cmd/http-server-mbt-thin/http-server-mbt-thin.exe"

          # 1. Assert binaries report "statically linked"
          file "$FULL_BIN" | grep -q "statically linked" || { echo "FATAL: $FULL_BIN is not statically linked!"; exit 1; }
          file "$THIN_BIN" | grep -q "statically linked" || { echo "FATAL: $THIN_BIN is not statically linked!"; exit 1; }

          # 2. Assert no dynamic program interpreter (PT_INTERP) is requested
          if readelf -l "$FULL_BIN" | grep -q "program interpreter"; then
            echo "FATAL: $FULL_BIN has dynamic interpreter PT_INTERP header!"
            exit 1
          fi
          if readelf -l "$THIN_BIN" | grep -q "program interpreter"; then
            echo "FATAL: $THIN_BIN has dynamic interpreter PT_INTERP header!"
            exit 1
          fi

          echo "PASS: Confirmed Linux binaries are 100% statically linked ELF (zero dynamic dependencies)."

      - name: Smoke-test CLI variants
        shell: bash
        run: |
          set -euo pipefail

          # MoonBit native currently outputs .exe on all platforms (Windows/Linux/macOS).
          # resolve_bin transparently finds either <bin>.exe or <bin> to prevent platform drift.
          resolve_bin() {
            local target="$1"
            if [ -f "${target}.exe" ]; then
              echo "${target}.exe"
            elif [ -f "${target}" ]; then
              echo "${target}"
            else
              echo "Error: binary not found at '${target}.exe' or '${target}'" >&2
              return 1
            fi
          }

          FULL_BIN="$(resolve_bin "_build/native/release/build/cmd/http-server-mbt/http-server-mbt")"
          THIN_BIN="$(resolve_bin "_build/native/release/build/cmd/http-server-mbt-thin/http-server-mbt-thin")"

          chmod +x "$FULL_BIN" "$THIN_BIN" || true

          # 1. Verify versions
          "$FULL_BIN" --version
          "$THIN_BIN" --version

          # 2. Thin CLI parameter rejection test (strictly exit code 1)
          for flag in "--cert cert.pem" "--key key.pem" "--key-passphrase pass" "-P" "--proxy http://127.0.0.1:3000" "--proxy-all" "--proxy-config proxy.json"; do
            set +e
            "$THIN_BIN" $flag 2>/dev/null
            exit_code=$?
            set -e
            if [ $exit_code -eq 0 ]; then
              echo "Error: http-server-mbt-thin accepted unsupported flag: $flag"
              exit 1
            fi
          done

          # 3. Full CLI help and proxy options
          "$FULL_BIN" --help
          "$THIN_BIN" --help

      - name: Verify generated version file is in sync
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code cmd/http-server-mbt/generated_version.mbt

      - name: Prepare Artifacts (Full & Thin CLI)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-cli
          EXE_EXT="${{ matrix.exe_ext }}"
          PLATFORM="${{ matrix.platform }}"

          resolve_bin() {
            local target="$1"
            if [ -f "${target}.exe" ]; then
              echo "${target}.exe"
            elif [ -f "${target}" ]; then
              echo "${target}"
            else
              echo "Error: binary not found at '${target}.exe' or '${target}'" >&2
              return 1
            fi
          }

          FULL_SRC="$(resolve_bin "_build/native/release/build/cmd/http-server-mbt/http-server-mbt")"
          THIN_SRC="$(resolve_bin "_build/native/release/build/cmd/http-server-mbt-thin/http-server-mbt-thin")"

          cp "$FULL_SRC" "release-cli/http-server-mbt-${PLATFORM}${EXE_EXT}"
          cp "$THIN_SRC" "release-cli/http-server-mbt-thin-${PLATFORM}${EXE_EXT}"
          chmod +x release-cli/* || true

      - name: Build and Test Distroless Docker Images (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          FULL_BIN="release-cli/http-server-mbt-linux-amd64"
          THIN_BIN="release-cli/http-server-mbt-thin-linux-amd64"

          # 1. Build Full and Thin images
          docker build -t http-server-mbt:full --build-arg BINARY_PATH="${FULL_BIN}" -f Dockerfile .
          docker build -t http-server-mbt:thin --build-arg BINARY_PATH="${THIN_BIN}" -f Dockerfile.thin .

          # 2. Test Thin container
          docker run -d --name test-thin -p 18081:8080 -v "$(pwd)/testdata/public:/data:ro" http-server-mbt:thin
          sleep 1
          if ! curl -sSf http://127.0.0.1:18081/hello.txt | grep -q "hello moonbit"; then
            echo "ERROR: Failed to fetch hello.txt from test-thin"
            docker logs test-thin
            exit 1
          fi
          docker stop test-thin && docker rm test-thin

          # 3. Test Full container
          docker run -d --name test-full -p 18082:8080 -v "$(pwd)/testdata/public:/data:ro" http-server-mbt:full
          sleep 1
          if ! curl -sSf http://127.0.0.1:18082/hello.txt | grep -q "hello moonbit"; then
            echo "ERROR: Failed to fetch hello.txt from test-full"
            docker logs test-full
            exit 1
          fi
          docker stop test-full && docker rm test-full

          echo "Distroless Docker images (full & thin) verified successfully!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: release-cli/
          retention-days: 7

  publish:
    name: Publish to mooncakes.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry & Dependencies
        run: moon update

      - name: Verify Tag Version
        shell: bash
        run: |
          module_version="$(moon -q run cmd/http-server-mbt -- --version)"
          if [ "v${module_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match moon.mod version ${module_version}."
            exit 1
          fi

      - name: Configure Mooncakes Credentials
        shell: bash
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_CREDENTIALS }}
        run: |
          if [ -z "${MOONCAKES_CREDENTIALS}" ]; then
            echo "MOONCAKES_CREDENTIALS is not configured."
            exit 1
          fi
          install -d -m 700 "${HOME}/.moon"
          printf '%s' "${MOONCAKES_CREDENTIALS}" > "${HOME}/.moon/credentials.json"
          chmod 600 "${HOME}/.moon/credentials.json"

      - name: Publish Module
        run: moon publish

  release:
    name: Create GitHub Release (CLI)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Release CLI Binaries
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
