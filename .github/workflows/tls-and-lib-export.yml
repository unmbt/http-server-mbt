# TLS and Lib Export Matrix CI (Windows, Linux, macOS)
# Covers min/full test suites, CLI builds, C ABI dynamic & static libraries, and artifact packaging.

name: TLS and Lib Export (Matrix CI)

on:
  push:
    branches:
      - feat/tls-and-lib-export
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tls-and-lib-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-build:
    name: ${{ matrix.os_name }} (${{ matrix.arch }}) · test/cli/lib-export
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            arch: x86_64
            platform: windows-amd64
            exe_ext: ".exe"
          - os: ubuntu-latest
            os_name: Linux
            arch: x86_64
            platform: linux-amd64
            exe_ext: ""
          - os: macos-latest
            os_name: macOS
            arch: arm64
            platform: macos-arm64
            exe_ext: ""

    steps:
      - name: Disable Git EOL conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify fixture bytes (no CRLF rewrite)
        shell: bash
        run: |
          set -euo pipefail
          size=$(wc -c < testdata/public/hello.txt | tr -d ' ')
          if [ "$size" != "14" ]; then
            echo "testdata/public/hello.txt is $size bytes, expected 14 (LF). Git EOL conversion leaked into fixtures."
            exit 1
          fi

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry & Dependencies
        run: moon update

      - name: Check (native)
        run: moon check --target native

      - name: Test (native - min and full suites)
        run: moon test --target native

      - name: Build Release (native)
        run: moon build cmd/http-server-min cmd/http-server-full cmd/http-server-mbt --target native --release

      - name: Smoke-test CLI variants
        shell: bash
        run: |
          set -euo pipefail
          MIN_BIN="_build/native/release/build/cmd/http-server-min/http-server-min.exe"
          FULL_BIN="_build/native/release/build/cmd/http-server-full/http-server-full.exe"
          MBT_BIN="_build/native/release/build/cmd/http-server-mbt/http-server-mbt.exe"

          test -f "$MIN_BIN"
          test -f "$FULL_BIN"
          test -f "$MBT_BIN"

          chmod +x "$MIN_BIN" "$FULL_BIN" "$MBT_BIN" || true

          # 1. Verify versions
          "$MIN_BIN" --version
          "$FULL_BIN" --version
          "$MBT_BIN" --version

          # 2. Min CLI parameter rejection test (D-08 / D-15)
          set +e
          "$MIN_BIN" --cert cert.pem 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "Error: http-server-min accepted --cert flag!"
            exit 1
          fi
          "$MIN_BIN" --proxy http://127.0.0.1:3000 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "Error: http-server-min accepted --proxy flag!"
            exit 1
          fi
          set -e

          # 3. Full CLI capability check
          "$FULL_BIN" --help

      - name: Verify generated version file is in sync
        shell: bash
        run: git diff --exit-code cmd/http-server-mbt/generated_version.mbt

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and Verify C ABI Libraries (min & full)
        run: moon run scripts/build_cabi.mbtx

      - name: Prepare Release Artifacts (CLI & C ABI SDK)
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="release-assets"
          SDK_DIR="cabi-sdk"
          rm -rf "$RELEASE_DIR" "$SDK_DIR"
          mkdir -p "$RELEASE_DIR" "$SDK_DIR/include" "$SDK_DIR/lib"

          EXE_EXT="${{ matrix.exe_ext }}"
          PLATFORM="${{ matrix.platform }}"

          # 1. Standalone CLI binaries (direct bare executables for install scripts)
          cp "_build/native/release/build/cmd/http-server-mbt/http-server-mbt.exe" "$RELEASE_DIR/http-server-mbt-${PLATFORM}${EXE_EXT}"
          cp "_build/native/release/build/cmd/http-server-min/http-server-min.exe" "$RELEASE_DIR/http-server-min-${PLATFORM}${EXE_EXT}"
          cp "_build/native/release/build/cmd/http-server-full/http-server-full.exe" "$RELEASE_DIR/http-server-full-${PLATFORM}${EXE_EXT}"
          chmod +x "$RELEASE_DIR/"* || true

          # 2. C ABI SDK (header + libraries)
          cp "target/cabi/include/http_server.h" "$SDK_DIR/include/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/cabi/hs_min.dll "$SDK_DIR/lib/"
            cp target/cabi/hs_min.lib "$SDK_DIR/lib/"
            cp target/cabi/hs_min_static.lib "$SDK_DIR/lib/"
            cp target/cabi/hs_full.dll "$SDK_DIR/lib/"
            cp target/cabi/hs_full.lib "$SDK_DIR/lib/"
            cp target/cabi/hs_full_static.lib "$SDK_DIR/lib/"
            tar -acf "$RELEASE_DIR/http-server-cabi-${PLATFORM}.zip" -C "$SDK_DIR" include lib
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp target/cabi/libhs_min.dylib "$SDK_DIR/lib/"
            cp target/cabi/libhs_min.a "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.dylib "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.a "$SDK_DIR/lib/"
            tar -czf "$RELEASE_DIR/http-server-cabi-${PLATFORM}.tar.gz" -C "$SDK_DIR" include lib
          else
            cp target/cabi/libhs_min.so "$SDK_DIR/lib/"
            cp target/cabi/libhs_min.a "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.so "$SDK_DIR/lib/"
            cp target/cabi/libhs_full.a "$SDK_DIR/lib/"
            tar -czf "$RELEASE_DIR/http-server-cabi-${PLATFORM}.tar.gz" -C "$SDK_DIR" include lib
          fi

          echo "=== Release Assets Ready ==="
          ls -la "$RELEASE_DIR"

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: http-server-mbt-${{ matrix.platform }}-assets
          path: release-assets/
          retention-days: 7
